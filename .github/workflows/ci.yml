name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks before it publishes an image.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The steps run on the runner, where a service container is on localhost,
    # not under its name as in Compose. None of these values is a secret: the
    # database and Redis exist for this run only.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      PULSE_REDIS_URL: redis://localhost:6379/1
      PULSE_WEBHOOK_SECRET: ci-only-not-a-secret
      PULSE_JWT_SECRET: ci-only-not-a-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      # The thorough profile in tests/conftest.py: 2000 examples per property.
      HYPOTHESIS_PROFILE: ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: pytest -n auto --cov

      - name: Image builds (docker build)
        run: docker build --tag pulse:ci .

      # The tests ran with the dev packages installed. This runs the image itself,
      # which has only the runtime ones: a package filed under the wrong
      # requirements file fails here.
      - name: Image works (migrate, API, worker)
        run: |
          env | grep -E '^(DJANGO|POSTGRES|CELERY|PULSE)_' > image.env
          image="docker run --network host --env-file image.env"
          request="curl --fail --silent --show-error"
          account='{"email": "ci@example.com", "password": "a long passphrase for ci"}'

          $image --rm pulse:ci python manage.py migrate --no-input
          $image --detach --name api pulse:ci
          $image --detach --name worker pulse:ci celery -A config --quiet worker --concurrency 1

          $request --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/ready
          $request --json "$account" http://localhost:8000/signup
          $request --json "$account" http://localhost:8000/login > /dev/null

          for attempt in 1 2 3 4 5; do
            if $image --rm pulse:ci celery -A config inspect ping --timeout 5; then
              exit 0
            fi
          done
          exit 1

      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs worker || true

  catcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --tag catcher:ci catcher

      - name: Tests (pytest)
        run: docker run --rm --env PULSE_WEBHOOK_SECRET=ci-only-not-a-secret catcher:ci pytest -q
