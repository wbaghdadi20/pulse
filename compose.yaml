name: pulse

services:
  api:
    build: .
    env_file: .env
    # Longer than gunicorn waits for requests in flight (graceful_timeout, 30 s).
    # Docker's default of 10 s would cut a slow "check now" off mid-request.
    stop_grace_period: 35s
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - monitoring

  worker:
    build: .
    command: celery -A config --quiet worker
    env_file: .env
    # Longer than a check's 75 s time limit: on stop, running checks finish and
    # release their locks instead of being killed with the lock still held.
    stop_grace_period: 80s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - monitoring

  beat:
    build: .
    command: celery -A config --quiet beat --schedule /tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catcher:
    build: ./catcher
    environment:
      PULSE_WEBHOOK_SECRET: ${PULSE_WEBHOOK_SECRET:?set PULSE_WEBHOOK_SECRET in .env}
    ports:
      - "8400:8000"

  flaky:
    # A tiny target Pulse can monitor; switch it with POST /mode (see flaky/main.py).
    build: ./flaky
    ports:
      - "8200:8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

# Shared with the separate `shop` project (shop/compose.yaml), so the api container
# can reach shop by name. Created once by hand: docker network create pulse-net
networks:
  monitoring:
    name: pulse-net
    external: true

volumes:
  pgdata:
