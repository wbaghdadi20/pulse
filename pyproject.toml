[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db"
# Import the project from the rootdir only. Without these, pytest-django adds the
# folder holding manage.py to sys.path, which makes mutmut (running from a copy in
# mutants/) test the original code instead of the mutated copy.
pythonpath = ["."]
django_find_project = false

[tool.coverage.run]
source = ["accounts", "core", "monitors"]
omit = ["*/migrations/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# The incident module alone has no survivors (27/27 killed), so mutate the whole
# monitors + core source. Thin or declarative modules are left out: models/admin/apps
# mutants are mostly string changes nobody should write tests for.
source_paths = ["monitors/", "core/", "accounts/"]
do_not_mutate = [
    "*/migrations/*",
    "*/management/*",
    "*/admin.py",
    "*/apps.py",
    "*/models.py",
]
# mutmut runs the tests from a copy in mutants/ (it copies tests/ and pyproject.toml
# itself); Django needs the settings there too.
also_copy = [
    "config/",
    # tests/test_project_files.py reads these.
    "compose.yaml",
    "gunicorn.conf.py",
    ".pre-commit-config.yaml",
    "requirements-dev.txt",
]

[tool.ruff.lint.isort]
# shop/ is a second project in this repo; name its packages so isort groups them
# as first-party there too (ruff otherwise decides by whether the file exists at the root).
known-first-party = ["accounts", "catalog", "config", "core", "monitors", "tests"]

[tool.mypy]
# --strict for the source; see the override below for the tests.
strict = true
# Not part of --strict: flag code that no branch can reach (a dead isinstance arm).
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Explicit: shop/ and flaky/ are separate apps with their own settings and
# dependencies, and shop/ reuses the package names config/ and core/.
files = ["accounts", "config", "core", "monitors", "tests", "manage.py"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
# Test functions take fixtures by name; annotating every `api`, `monitor`, `settings`
# parameter adds nothing, and the same goes for small helpers next to the tests.
# Bodies are still type-checked (check_untyped_defs stays on).
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings_typecheck"
