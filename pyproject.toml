[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.coverage.run]
source = ["core", "monitors"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
